<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Credit Default Prediction</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Credit Default Prediction</h1>

        <p>Enter customer details to predict credit default risk.</p>

        <form id="predictionForm">

            <label>Credit Limit</label>
            <input type="number" id="LIMIT_BAL" required>


            <label>Sex</label>
            <input type="number" id="SEX" required>


            <label>Education</label>
            <input type="number" id="EDUCATION" required>


            <label>Marriage</label>
            <input type="number" id="MARRIAGE" required>


            <label>Age</label>
            <input type="number" id="AGE" required>


            <label>Pay 1</label>
            <input type="number" id="PAY_1" required>


            <label>Pay 2</label>
            <input type="number" id="PAY_2" required>


            <label>Pay 3</label>
            <input type="number" id="PAY_3" required>


            <label>Pay 4</label>
            <input type="number" id="PAY_4" required>


            <label>Pay 5</label>
            <input type="number" id="PAY_5" required>


            <label>Pay 6</label>
            <input type="number" id="PAY_6" required>


            <label>Bill Amount 1</label>
            <input type="number" id="BILL_AMT1" required>


            <label>Bill Amount 2</label>
            <input type="number" id="BILL_AMT2" required>


            <label>Bill Amount 3</label>
            <input type="number" id="BILL_AMT3" required>


            <label>Bill Amount 4</label>
            <input type="number" id="BILL_AMT4" required>


            <label>Bill Amount 5</label>
            <input type="number" id="BILL_AMT5" required>


            <label>Bill Amount 6</label>
            <input type="number" id="BILL_AMT6" required>


            <label>Payment Amount 1</label>
            <input type="number" id="PAY_AMT1" required>


            <label>Payment Amount 2</label>
            <input type="number" id="PAY_AMT2" required>


            <label>Payment Amount 3</label>
            <input type="number" id="PAY_AMT3" required>


            <label>Payment Amount 4</label>
            <input type="number" id="PAY_AMT4" required>


            <label>Payment Amount 5</label>
            <input type="number" id="PAY_AMT5" required>


            <label>Payment Amount 6</label>
            <input type="number" id="PAY_AMT6" required>


            <button type="submit">Predict</button>

        </form>


        <div id="result"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
